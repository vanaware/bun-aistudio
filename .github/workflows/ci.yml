name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  check-all:
    name: Test & Lint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

      - name: Lint and type check
        run: bun run lint
